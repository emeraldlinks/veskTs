name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A green run on main publishes `latest` (bump + changelog + tag + release).
  # `workflow_dispatch` is for publishing a prerelease channel by hand.
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (stable moves `latest`; the default for pushes)
        type: choice
        default: stable
        options: [stable, beta, canary]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests-js:
    name: tests.js — unit + adapter e2e + edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
      - name: Run scripts/test.js
        env:
          CHROMIUM_PATH: ${{ steps.setup.outputs.chrome-path }}
        run: node scripts/test.js


  dev-test:
    name: dev-test.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
      - name: Run tests/dev-test.mjs
        env:
          CHROMIUM_PATH: ${{ steps.setup.outputs.chrome-path }}
        run: npx tsx tests/dev-test.mjs

  prod-hydration:
    name: production-hydration-test.mjs — prod hydration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
      - name: Run tests/production-hydration-test.mjs
        env:
          CHROMIUM_PATH: ${{ steps.setup.outputs.chrome-path }}
        run: npx tsx tests/production-hydration-test.mjs

  dev-hydration:
    name: hydration-test.mjs — dev hydration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
      - name: Start dev server (scripts/e2e-setup.js) and run tests/hydration-test.mjs
        env:
          CHROMIUM_PATH: ${{ steps.setup.outputs.chrome-path }}
        run: |
          setsid nohup npx tsx scripts/e2e-setup.js > /tmp/e2e.log 2>&1 < /dev/null &
          for i in $(seq 1 180); do
            grep -q E2E_SERVERS_READY /tmp/e2e.log && break
            sleep 1
          done
          grep -q E2E_SERVERS_READY /tmp/e2e.log || { echo "e2e-setup failed to start"; cat /tmp/e2e.log; exit 1; }
          BASE=http://localhost:3002 node tests/hydration-test.mjs
          RC=$?
          pkill -f e2e-setup.js 2>/dev/null || true
          exit $RC

  publish:
    name: Publish to npm + GitHub tag & release
    needs: [tests-js, dev-test, prod-hydration, dev-hydration]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve channel
        id: channel
        run: |
          # Every green run on main publishes to `latest` — that is the
          # contract, and a merge that does not ship is a merge that lied.
          # `workflow_dispatch` can publish a prerelease channel instead.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
          else
            CHANNEL=stable
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "publishing channel: $CHANNEL"

      - name: Skip a push if no packages/ files changed
        id: changed
        if: github.event_name == 'push'
        run: |
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"; fi
          if git diff --name-only "$BASE" HEAD 2>/dev/null | grep -q '^packages/'; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "packages changed — publishing ${{ steps.channel.outputs.channel }}"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "no packages/** changes — skipping publish"
          fi

      - name: Publish
        if: steps.changed.outputs.changed != 'no'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          VERSION="$(node scripts/next-version.mjs "$CHANNEL")"
          echo "version: $VERSION (channel $CHANNEL)"
          node scripts/release.mjs "$VERSION" --channel "$CHANNEL"

      # A canary must never touch the changelog, the git tag or the committed
      # version: that churn is what made "publish on every merge" untenable.
      - name: Changelog, version commit, tag and GitHub release
        if: steps.channel.outputs.channel == 'stable' && steps.changed.outputs.changed != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -e "console.log(require('./packages/types/package.json').version)")"
          git config user.name  "github-actions[bot]"
          git config user.email "41898292+github-actions[bot]@users.noreply.github.com"
          node scripts/changelog.mjs "$VERSION"
          git add CHANGELOG.md packages/*/package.json packages/create-vesk/src/index.js
          git diff --cached --quiet || git commit -m "release: v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:"refs/heads/${{ github.ref_name }}"
          git push origin "v$VERSION"
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "## Changes in v$VERSION"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --oneline "$PREV_TAG"..HEAD~1
            else
              git log --oneline -20 HEAD~1
            fi
            echo ""
            echo "**npm:** \`latest\` now points at v$VERSION. Canary builds of main: \`npm i @vesk/runtime@canary\`."
          } > release-notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --verify-tag
